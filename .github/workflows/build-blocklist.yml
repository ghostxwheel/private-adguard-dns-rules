name: Hostlist Compiler

on:
  schedule:
    # 21:00 UTC = 00:00 GMT+3
    - cron: '0 21 * * *'
  workflow_dispatch:

concurrency:
  group: hostlist-compiler
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Step 3: Install dependencies. @adguard/hostlist-compiler is installed
      # locally, not globally, since scripts/normalize-blacklist.js requires
      # its rule-parsing utilities directly. Playwright/Chromium is only
      # used for adblock.mahakala.is - see Step 5.
      - name: Install dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium

      # Step 4: Clean old hostlist files
      - name: Clean hostlists folder
        run: |
          rm -rf hostlists
          mkdir -p hostlists

      # Step 5: Fetch remote rules. Three sources are fetched with plain
      # HTTP. adblock.mahakala.is is behind Cloudflare, which returns HTTP
      # 403 for a plain request from GitHub Actions' runner IPs (works fine
      # with the same headers from a residential IP - it's scoring IP
      # reputation/TLS fingerprint, not just headers), so that one is
      # specifically fetched via headless Chromium instead.
      - name: Fetch remote rules
        run: node scripts/fetch-remote-rules.js

      # Step 6: Compile hostlist. transformations is [] in configuration.json -
      # this just fetches and concatenates sources; scripts/normalize-blacklist.js
      # does the comment-stripping/canonicalization/dedup/compression work that
      # hostlist-compiler's own RemoveComments+Compress+Deduplicate transforms
      # would otherwise do. Its Compress implementation discards redundant
      # subdomain rules via Array.splice() in a loop, which is O(n^2) - fine
      # for a few hundred thousand rules, but it doesn't finish within 10
      # minutes on lists this size (millions of rules). normalize-blacklist.js
      # does the equivalent work with a Set + filter() in under a minute.
      - name: Compile hostlist
        run: npx hostlist-compiler -c configuration.json -o dns-blacklist.txt

      # Step 6b: Normalize dns-blacklist.txt - strip comment/separator lines,
      # expand /etc/hosts-style and bare-domain lines into "||domain^" rules,
      # convert leftover "domain #comment" entries, discard rules for
      # subdomains already covered by a parent-domain rule, and dedupe
      - name: Normalize and deduplicate blocklist
        run: node scripts/normalize-blacklist.js

      # Step 7: Commit and push only if dns-blacklist.txt changed
      - name: Commit and push changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add dns-blacklist.txt

          if ! git diff --cached --quiet; then
            git commit -m "Update dns-blacklist.txt"

            # Rebase on latest remote changes to avoid push rejection
            git pull --rebase origin main

            git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:main
          else
            echo "No changes detected in dns-blacklist.txt, skipping commit."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
