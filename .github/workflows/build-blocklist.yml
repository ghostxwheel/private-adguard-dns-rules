name: Hostlist Compiler

on:
  schedule:
    # 21:00 UTC = 00:00 GMT+3
    - cron: '0 21 * * *'
  workflow_dispatch:

concurrency:
  group: hostlist-compiler
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Step 3: Install hostlist-compiler globally
      - name: Install Hostlist Compiler
        run: npm install -g @adguard/hostlist-compiler

      # Step 4: Clean old hostlist files
      - name: Clean hostlists folder
        run: |
          rm -rf hostlists
          mkdir -p hostlists

      # Step 5: Fetch remote rules
      - name: Fetch remote rules
        run: |
          curl -sSL https://sysctl.org/cameleon/hosts -o hostlists/cameleon_hosts.txt
          curl -sSL https://s3.amazonaws.com/lists.disconnect.me/simple_tracking.txt -o hostlists/lists.disconnect.me_simple_tracking.txt
          curl -sSL https://adblock.mahakala.is -o hostlists/adblock.mahakala.is.txt
          curl -sSL https://phishing.army/download/phishing_army_blocklist_extended.txt -o hostlists/phishing_army_blocklist_extended.txt

      # Step 6: Compile hostlist
      - name: Compile hostlist
        run: hostlist-compiler -c configuration.json -o dns-blacklist.txt

      # Step 7: Commit and push only if dns-blacklist.txt changed
      - name: Commit and push changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add dns-blacklist.txt

          if ! git diff --cached --quiet; then
            git commit -m "Update dns-blacklist.txt"

            # Rebase on latest remote changes to avoid push rejection
            git pull --rebase origin main

            git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:main
          else
            echo "No changes detected in dns-blacklist.txt, skipping commit."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
